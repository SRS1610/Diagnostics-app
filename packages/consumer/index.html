<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Not indexable: every URL here contains a capability token. -->
    <meta name="robots" content="noindex, nofollow" />
    <!-- Stops the token in the path leaking to any third party the page
         links out to (the referrer would otherwise carry it). -->
    <meta name="referrer" content="no-referrer" />

  </head>
