<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Sign In — Diagnostics Platform</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f5f5f7; --panel: #ffffff; --line: #e5e5ea;
    --accent: #2f6fed; --accent-soft: #eaf1ff;
    --text: #1d1d1f; --text-muted: #6e6e73; --text-faint: #a1a1a6;
    --font: 'Inter', -apple-system, sans-serif;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font-family: var(--font); -webkit-font-smoothing: antialiased; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 18px; padding: 36px; width: 360px; }
  .brand { display: flex; align-items: center; gap: 10px; margin-bottom: 26px; }
  .brand-mark { width: 30px; height: 30px; border-radius: 9px; background: var(--accent); display:flex; align-items:center; justify-content:center; }
  .brand-mark svg { width: 16px; height: 16px; }
  .brand-name { font-weight: 700; font-size: 15px; }
  h1 { font-size: 19px; font-weight: 700; letter-spacing: -0.01em; margin: 0 0 6px; }
  .sub { font-size: 12.5px; color: var(--text-muted); margin-bottom: 24px; }
  .field { margin-bottom: 14px; }
  .field label { display: block; font-size: 11px; font-weight: 700; margin-bottom: 6px; color: var(--text-muted); }
  .field input { width: 100%; padding: 11px 13px; border-radius: 10px; border: 1px solid var(--line); background: #fafafb; font-size: 13px; font-family: inherit; }
  .btn { display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 13.5px; padding: 13px; border-radius: 100px; background: var(--text); color: #fff; margin-top: 6px; }
  .role-note { margin-top: 20px; padding: 12px 14px; background: var(--accent-soft); border-radius: 10px; font-size: 11px; color: var(--accent); line-height: 1.5; }
  .divider { text-align: center; font-size: 11px; color: var(--text-faint); margin: 18px 0; }
</style>
</head>
<body>
  <div class="card">
    <div class="brand">
      <div class="brand-mark"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg></div>
      <div class="brand-name">Diagnostics Platform</div>
    </div>
    <h1>Sign in</h1>
    <div class="sub">Access your organization's portal, or the Master Console if you manage the platform.</div>

    <div class="field">
      <label>Email</label>
      <input type="email" placeholder="you@company.com" value="admin@acmewireless.com" />
    </div>
    <div class="field">
      <label>Password</label>
      <input type="password" placeholder="••••••••" value="••••••••••" />
    </div>
    <div class="btn">Sign In</div>

    <div class="role-note">
      Where you land depends on your role: <b>Tenant Admin/Staff</b> go straight to their organization's portal. <b>Master Admin</b> lands in the cross-tenant Master Console.
    </div>
  </div>
</body>
</html>
