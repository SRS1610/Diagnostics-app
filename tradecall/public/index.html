<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>TradeCall</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <div class="shell" id="shell" hidden>
    <aside class="side">
      <div class="brand"><span class="mark" aria-hidden="true">TC</span><span><b id="biz">TradeCall</b><small id="biz-number"></small></span></div>
      <nav id="tenant-nav">
        <a href="#/dashboard" data-nav="dashboard"><span aria-hidden="true">▦</span> Dashboard</a>
        <a href="#/inbox" data-nav="inbox"><span aria-hidden="true">✉</span> Inbox <em id="open-count" hidden></em></a>
        <a href="#/team" data-nav="team"><span aria-hidden="true">☺</span> Team</a>
        <a href="#/settings" data-nav="settings" data-manager><span aria-hidden="true">⚙</span> Settings</a>
      </nav>
      <nav id="platform-nav" hidden>
        <a href="#/platform" data-nav="platform"><span aria-hidden="true">▤</span> Businesses</a>
        <a href="#/platform-activity" data-nav="platform-activity"><span aria-hidden="true">≡</span> Activity</a>
      </nav>
      <button class="ghost" id="signout">Sign out</button>
    </aside>
    <div class="main">
      <div class="support-bar" id="support-bar" hidden></div>
      <div class="notice" id="notice" hidden></div>
      <main id="view"></main>
    </div>
  </div>
  <main id="auth" hidden></main>
  <div class="toast" id="toast" role="status" hidden></div>
  <script src="/app.js"></script>
</body>
</html>
