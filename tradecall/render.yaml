# Render blueprint. Render reads render.yaml from the repo root — move this
# there (or into tradecall's own repo) when deploying.
services:
  - type: web
    name: tradecall
    runtime: node
    rootDir: tradecall
    buildCommand: npm ci && npx prisma generate && npm run build
    preDeployCommand: npx prisma migrate deploy
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase: { name: tradecall-db, property: connectionString }
      - key: JWT_SECRET
        generateValue: true
      - { key: PUBLIC_URL, sync: false }
      - { key: TELNYX_API_KEY, sync: false }
      - { key: TELNYX_PUBLIC_KEY, sync: false }
      - { key: TELNYX_CONNECTION_ID, sync: false }
      - { key: TELNYX_MESSAGING_PROFILE_ID, sync: false }
      - { key: RESEND_API_KEY, sync: false }
      - { key: DIGEST_FROM_EMAIL, sync: false }
databases:
  - name: tradecall-db
    plan: basic-256mb
