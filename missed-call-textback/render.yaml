# Render blueprint for this service. Render reads render.yaml from the repo
# root, so this applies once missed-call-textback is in its own repository
# (or copy the service block into the root render.yaml with rootDir set).
services:
  - type: web
    name: missed-call-textback
    runtime: node
    rootDir: missed-call-textback
    buildCommand: npm ci && npx prisma generate && npm run build
    preDeployCommand: npx prisma migrate deploy
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase: { name: textback-db, property: connectionString }
      - key: JWT_SECRET
        generateValue: true
      - key: PUBLIC_BASE_URL
        sync: false
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_MESSAGING_SERVICE_SID
        sync: false
      - key: SENDGRID_API_KEY
        sync: false
      - key: SENDGRID_FROM_EMAIL
        sync: false
databases:
  - name: textback-db
    plan: basic-256mb
